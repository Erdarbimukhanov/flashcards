<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn Mode</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6" 
      style="background-color: #48cae4">
  <!-- Выбор режима -->
  <div id="mode-select" class="max-w-xl w-full">
    <h1 class="text-3xl font-bold text-center mb-6">Выберите режим обучения</h1>
    <div class="grid grid-cols-1 gap-6">
      <button onclick="startMCQ()" class="w-full bg-blue-600 text-white p-4 rounded-lg hover:bg-blue-700 text-xl">MCQ — Тест с вариантами</button>
      <button onclick="startFRQ()" class="w-full bg-green-600 text-white p-4 rounded-lg hover:bg-green-700 text-xl">FRQ — Написать ответ</button>
    </div>
  </div>

  <!-- MCQ режим -->
  <div id="mcq-mode" class="hidden max-w-xl w-full">
    <h2 class="text-2xl font-bold text-center mb-4">Выбери правильное определение</h2>
    <p id="mcq-question" class="text-lg font-semibold mb-4"></p>
    <div id="mcq-options" class="space-y-3 mb-4"></div>
    <button onclick="nextMCQ()" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Следующий</button>
  </div>

  <!-- FRQ режим -->
  <div id="frq-mode" class="hidden max-w-xl w-full"></div>

  <!-- Кнопка назад -->
  <button onclick="goBack()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 mt-10">Back</button>

  <script>
    const cards = [
      { term: "Algorithm", definition: "шаги для решения задачи" },
      { term: "Data Structure", definition: "способ организации данных" },
      { term: "Recursion", definition: "функция, вызывающая себя" },
      { term: "Loop", definition: "цикл для повторения действий" },
      { term: "Variable", definition: "именованная область памяти" },
      { term: "Function", definition: "блок кода с именем и параметрами" },
      { term: "Class", definition: "шаблон для создания объектов" },
      { term: "Stack", definition: "структура LIFO" },
      { term: "Queue", definition: "структура FIFO" },
      { term: "Big O", definition: "обозначение сложности алгоритма" }
    ];

    // Переключение режимов
    function startMCQ() {
      document.getElementById('mode-select').classList.add('hidden');
      document.getElementById('mcq-mode').classList.remove('hidden');
      loadMCQ();
    }

    function startFRQ() {
      document.getElementById('mode-select').classList.add('hidden');
      renderFRQLayout();
      loadFRQ();
    }

    // MCQ
    let mcqIndex = 0;
    function loadMCQ() {
      const card = cards[mcqIndex];
      document.getElementById('mcq-question').innerText = `Что такое "${card.term}"?`;
      const options = [card.definition];
      while (options.length < 4) {
        const rand = cards[Math.floor(Math.random() * cards.length)].definition;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);
      const container = document.getElementById('mcq-options');
      container.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.className = 'w-full p-3 border rounded text-left bg-white hover:bg-gray-100';
        btn.onclick = () => {
          if (opt === card.definition) btn.classList.add('bg-green-300');
          else {
            btn.classList.add('bg-red-300');
            [...container.children]
              .find(b => b.textContent === card.definition)
              ?.classList.add('bg-green-300');
          }
          [...container.children].forEach(b => b.disabled = true);
        };
        container.appendChild(btn);
      });
    }
    function nextMCQ() {
      mcqIndex = (mcqIndex + 1) % cards.length;
      loadMCQ();
    }

    // FRQ
    let frqIndex = 0;
    let frqCorrectCount = 0;
    function renderFRQLayout() {
      document.getElementById('frq-mode').innerHTML = `
        <h2 class="text-2xl font-bold text-center mb-4">Напиши определение</h2>
        <p id="frq-question" class="text-lg font-semibold mb-2"></p>
        <textarea id="frq-answer" rows="4" class="w-full p-2 border border-gray-300 rounded" placeholder="Введи ответ..."></textarea>
        <div class="mt-4 flex justify-between items-center">
          <button onclick="checkFRQ()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Проверить</button>
          <button onclick="nextFRQ()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Следующий</button>
        </div>
        <p id="frq-feedback" class="mt-4 text-lg font-semibold"></p>
      `;
      document.getElementById('frq-mode').classList.remove('hidden');
    }
    function loadFRQ() {
      const card = cards[frqIndex];
      document.getElementById('frq-question').innerText = `Что такое "${card.term}"?`;
      document.getElementById('frq-answer').value = '';
      document.getElementById('frq-feedback').innerText = '';
    }
    function checkFRQ() {
      const userWords = document.getElementById('frq-answer').value.trim().split(/\s+/);
      const correctWords = cards[frqIndex].definition.trim().split(/\s+/);
      const matches = userWords.filter((w,i) => w.toLowerCase() === correctWords[i]?.toLowerCase()).length;
      if (matches === correctWords.length) frqCorrectCount++;
      document.getElementById('frq-feedback').innerText = `Совпадений: ${matches} из ${correctWords.length} слов.`;
    }
    function nextFRQ() {
      frqIndex++;
      if (frqIndex >= cards.length) {
        document.getElementById('frq-mode').innerHTML = `
          <h2 class="text-2xl font-bold text-center mb-4">Результат</h2>
          <p class="text-lg text-center mb-6">Вы правильно ответили на <strong>${frqCorrectCount}</strong> из ${cards.length} вопросов.</p>
          <button onclick="restartFRQ()" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700">Пройти заново</button>
        `;
        return;
      }
      loadFRQ();
    }
    function restartFRQ() {
      frqIndex = 0;
      frqCorrectCount = 0;
      renderFRQLayout();
      loadFRQ();
    }

    // Исправленный goBack: просто возвращаемся назад в истории
    function goBack() {
      history.back();
    }
  </script>
</body>
</html>
