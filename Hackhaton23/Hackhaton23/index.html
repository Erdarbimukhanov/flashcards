<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Educational Flashcards: Computer Science</title>
  <!-- Tailwind CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    rel="stylesheet"
  />
  <style>
    /* Фоновое изображение */
    body {
      background-image: url("cpu-chip-on-motherboard-computer-processor-chip-on-a-circuit-board-with-microchips-and-other-computer-parts-free-vector.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Стили карточки */
    .card { perspective: 1000px; }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      padding: 1rem;
      border-radius: 1rem;
    }
    .card-back { transform: rotateY(180deg); background-color: rgba(249,250,251,0.9); }

    /* Навигационные вкладки */
    .nav-tab {
      background-color: #2d3748;
      color: white;
      padding: 1rem;
      border-radius: 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .nav-tab:hover { background-color: #4a5568; }

    /* Список карточек */
    .card-list {
      max-height: 300px;
      overflow-y: auto;
      margin-top: 1rem;
    }
    .card-list-item {
      display: flex;
      align-items: center;
      padding: 0.75rem;
      border-bottom: 1px solid #e5e7eb;
      font-size: 1.1rem;
    }
    .card-list-item img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      margin-right: 1rem;
      border-radius: 0.25rem;
    }
    /* Делает текст внизу жирным */
    .card-list-item p {
      font-weight: bold;
    }
    .card-list {
      max-height: 300px;
      overflow-y: auto;
      margin-top: 1rem;
    }
    .card-list-item {
      display: flex;
      align-items: center;
      padding: 0.75rem;
      border-bottom: 1px solid #e5e7eb;
      font-size: 1.1rem;
    }
    .card-list-item img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      margin-right: 1rem;
      border-radius: 0.25rem;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-cover bg-center">
  <div class="max-w-4xl w-full">
    <!-- Заголовок страницы -->
    <div class="mb-6 text-center">
      <h3 class="text-4xl font-bold text-white">COMPUTER SCIENCE</h3>
    </div>

    <!-- Навигация -->
    <div class="grid grid-cols-5 gap-4 mb-6 justify-items-center">
      <div class="nav-tab" id="flashcards-btn">Flashcards</div>
      <div class="nav-tab" id="learn-btn">Learn</div>
      <div class="nav-tab" id="test-btn">Kazakh</div>
      <div class="nav-tab" id="blocks-btn">English</div>
    </div>

    <div class="max-w-lg w-full mx-auto">
      <!-- Окно текущей карточки -->
      <div class="text-center mb-6 bg-gray-800 bg-opacity-50 rounded-lg p-4">
        <h2 class="text-3xl font-bold text-white">Flashcards: Informatics</h2>
        <p class="text-gray-300">Click the card to flip</p>
      </div>

      <div id="flashcard" class="card w-full h-72 bg-white rounded-xl shadow-md overflow-hidden" onclick="flipCard()">
        <div class="card-inner">
          <!-- Лицевая сторона -->
          <div class="card-front">
            <img id="card-image" src="" alt="Topic" class="object-contain h-full w-full p-4" />
          </div>
          <!-- Обратная сторона -->
          <div class="card-back">
            <p id="card-description" class="text-gray-900"></p>
          </div>
        </div>
      </div>

      <!-- Кнопки навигации карточек -->
      <div class="mt-6 flex justify-between items-center">
        <button onclick="prevCard()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Previous</button>
        <span id="card-counter" class="text-white font-semibold">1 / 10</span>
        <button onclick="nextCard()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Next</button>
      </div>

      <!-- Список всех карточек -->
      <div class="card-list bg-gray-800 bg-opacity-40 rounded-lg mt-6 p-2">
        <div id="card-list"></div>
      </div>
    </div>
  </div>

  <script>
    // Набор карточек по информатике
    const cards = [
      { image: './Hackhaton/Algorithm.png', description: 'Algorithm – шаги для решения задачи.' },
      { image: './Hackhaton/Data Structure.png', description: 'Data Structure – способ организации данных.' },
      { image: './Hackhaton/Recursion.png', description: 'Recursion – функция, вызывающая себя.' },
      { image: './Hackhaton/Loop.png', description: 'Loop – цикл для повторения действий.' },
      { image: './Hackhaton/Variable.png', description: 'Variable – именованная область памяти.' },
      { image: './Hackhaton/Function.png', description: 'Function – блок кода с именем и параметрами.' },
      { image: './Hackhaton/Class.png', description: 'Class – шаблон для создания объектов.' },
      { image: './Hackhaton/Stack.png', description: 'Stack – структура LIFO.' },
      { image: './Hackhaton/Queue.png', description: 'Queue – структура FIFO.' },
      { image: './Hackhaton/Big O .png', description: 'Big O – обозначение сложности алгоритма.' }
    ];

    let currentIndex = 0;

    function loadCard(index) {
      document.getElementById('flashcard').classList.remove('flipped');
      document.getElementById('card-image').src = cards[index].image;
      document.getElementById('card-description').innerText = cards[index].description;
      document.getElementById('card-counter').innerText = `${index + 1} / ${cards.length}`;
    }

    function flipCard() {
      document.getElementById('flashcard').classList.toggle('flipped');
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      loadCard(currentIndex);
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % cards.length;
      loadCard(currentIndex);
    }

    function loadCardList() {
      const list = document.getElementById('card-list'); list.innerHTML = '';
      cards.forEach((card, idx) => {
        const item = document.createElement('div');
        item.className = 'card-list-item';
        item.innerHTML = `<span class="text-gray-200 mr-2">${idx+1}</span><p class="text-gray-200">${card.description}</p>`;
        list.appendChild(item);
      });
    }

    // Навигационные кнопки
    document.getElementById('flashcards-btn').addEventListener('click', () => { window.location.href = 'flashcards.html'; });
    document.getElementById('learn-btn').addEventListener('click', () => { window.location.href = 'learn.html'; });
    document.getElementById('test-btn').addEventListener('click', () => { window.location.href = 'kazakh.html'; });
    document.getElementById('blocks-btn').addEventListener('click', () => { window.location.href = 'english.html'; });

    // Инициализация
    loadCard(currentIndex);
    loadCardList();
  </script>
</body>
</html>
