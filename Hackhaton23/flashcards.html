<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .card { perspective: 1000px; }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      padding: 1rem;
      border-radius: 1rem;
    }
    .card-back {
      transform: rotateY(180deg);
      background-color: #f9fafb;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-lg w-full mx-auto">
    <div class="text-center mb-6">
      <h2 class="text-3xl font-bold">Flashcards</h2>
      <p class="text-gray-600">Click to flip, use ← (don't know) or → (know) keys</p>
    </div>

    <div class="flex justify-between mb-4">
      <span id="known-counter" class="text-green-500 font-semibold">Known: 0</span>
      <span id="unknown-counter" class="text-red-500 font-semibold">Unknown: 0</span>
    </div>

    <div id="flashcard" class="card w-full h-96 bg-white rounded-xl shadow-md overflow-hidden" onclick="flipCard()">
      <div class="card-inner">
        <div class="card-front">
          <img id="card-image" src="" alt="Topic" class="object-contain h-full w-full p-4" />
        </div>
        <div class="card-back">
          <p id="card-description"></p>
        </div>
      </div>
    </div>

    <div class="mt-6 flex justify-between items-center">
      <button onclick="goBack()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Back</button>
      <span id="card-counter" class="text-gray-700 font-semibold">1 / 29</span>
    </div>
  </div>

  <script>
    const cards = [
      { image: 'Hackathon/Algorithm.png', description: 'Algorithm – шаги для решения задачи.' },
      { image: 'Hackathon/Big O .png', description: 'Data Structure – способ организации данных.' },
      { image: 'Hackathon/Class.png', description: 'Recursion – функция, вызывающая себя.' },
      { image: 'Hackathon/Data Structure.png', description: 'Loop – цикл для повторения действий.' },
      { image: 'Hackathon/Function.png', description: 'Variable – именованная область памяти.' },
      { image: 'Hackathon/Loop.png', description: 'Function – блок кода с именем и параметрами.' },
      { image: 'Hackathon/Queue.png', description: 'Class – шаблон для создания объектов.' },
      { image: 'Hackathon/Recursion.png', description: 'Stack – структура LIFO.' },
      { image: 'Hackathon/Stack.png', description: 'Queue – структура FIFO.' },
      { image: 'Hackathon/Variable.png', description: 'Big O – обозначение сложности алгоритма.' }
    ];

    let state = {
      currentIndex: 0,
      knownCount: 0,
      unknownCount: 0
    };

    function loadCard(index) {
      const card = document.getElementById('flashcard');
      card.classList.remove('flipped');
      document.getElementById('card-image').src = cards[index].image;
      document.getElementById('card-description').innerText = cards[index].description;
      document.getElementById('card-counter').innerText = `${index + 1} / ${cards.length}`;
    }

    function flipCard() {
      document.getElementById('flashcard').classList.toggle('flipped');
    }

    function updateCounters(known) {
      if (known) {
        state.knownCount++;
        document.getElementById('known-counter').innerText = `Known: ${state.knownCount}`;
      } else {
        state.unknownCount++;
        document.getElementById('unknown-counter').innerText = `Unknown: ${state.unknownCount}`;
      }
    }

    function nextCard(known) {
      updateCounters(known);
      state.currentIndex++;
      if (state.currentIndex >= cards.length) {
        window.location.href = `AgzamMazgakrut.html?known=${state.knownCount}&unknown=${state.unknownCount}`;
        return;
      }
      loadCard(state.currentIndex);
    }

    function handleKeyPress(event) {
      if (event.key === 'ArrowRight') nextCard(true);
      else if (event.key === 'ArrowLeft') nextCard(false);
    }

    function goBack() {
      window.location.href = `AgzamMazgakrut.html?known=${state.knownCount}&unknown=${state.unknownCount}`;
    }

    function initFlashcards() {
      loadCard(state.currentIndex);
      document.addEventListener('keydown', handleKeyPress);
    }

    document.addEventListener('DOMContentLoaded', initFlashcards);
  </script>
</body>
</html>
